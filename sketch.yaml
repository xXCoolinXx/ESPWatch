default_profile: esp32_touch_128
profiles:
  esp32_touch_128:
    fqbn: esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=enabled
    platforms:
      - platform: esp32:esp32 (2.0.12)
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    libraries:
      - TFT_eSPI (2.5.43)
      - cst816t (1.5.1)
      - SensorLib (0.4.1)
      - ArduinoJson (7.4.3)
      # - Time (1.6.1)
      # - TimeAlarms (1.5.0)
      # - NTPClient (3.2.1)
